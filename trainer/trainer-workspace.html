<!DOCTYPE html>
<html>

<head>

<title>Trainer Workspace</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f6f9;
}

.header{
background:#00539f;
color:white;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.container{
width:90%;
margin:30px auto;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin:10px 0;
}

button{
background:#00539f;
color:white;
padding:10px 20px;
border:none;
border-radius:6px;
cursor:pointer;
margin-right:10px;
}

button:hover{
background:#003b75;
}

.logout{
background:red;
}

.task{
background:#fafafa;
padding:15px;
margin-top:15px;
border-left:5px solid #00539f;
}

</style>

</head>

<body>

<div class="header">

<h2>Trainer Workspace</h2>

<button
class="logout"
onclick="logout()">
Logout
</button>

</div>

<div class="container">

<div class="card">

<h2>Trainer Login</h2>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button
onclick="loginTrainer()">
Login
</button>

<p id="trainerName"></p>

</div>

<div class="card">

<h2>Trainee Submissions</h2>

<div id="submissionList">

Please login to view trainee submissions.

</div>

</div>

</div>

<script type="module" src="trainer-workspace.js"></script>

</body>

</html>
