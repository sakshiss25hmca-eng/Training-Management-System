<!DOCTYPE html>
<html>

<head>

<title>Trainer Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

body{
background:#f4f6f9;
}

.header{
background:#00539f;
color:white;
padding:20px;
text-align:center;
}

.container{
width:95%;
margin:20px auto;
display:flex;
gap:20px;
align-items:flex-start;
}

.left{
flex:3;
}

.right{
width:300px;
}

.card{
background:white;
padding:20px;
margin-bottom:20px;
border-radius:12px;
box-shadow:0 4px 10px rgba(0,0,0,.1);
}

.card h2{
color:#00539f;
margin-bottom:15px;
}

input,
textarea,
select{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;

}

textarea{
height:120px;
resize:none;
}

button{

background:#00539f;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;

}

button:hover{

background:#003f7f;

}

.logout{

background:#dc3545;

}

.task-item{

background:#f8f9fa;
padding:15px;
margin-top:10px;
border-radius:8px;

}

</style>

</head>

<body>

<div class="header">

<h1>Tata Steel Trainer Dashboard</h1>

<p>Assign Tasks to Trainees</p>

</div>


<div class="container">

<div class="left">

<div class="card">

<h2>Assign New Task</h2>

<select id="trainerSelect">

<option value="">Select Trainer</option>

</select>

<select id="traineeSelect">

<option value="">Select Trainee</option>

</select>

<input
type="text"
id="taskTitle"
placeholder="Task Title">

<textarea
id="taskDescription"
placeholder="Task Description">
</textarea>

<input
type="date"
id="dueDate">

<button onclick="assignTask()">

Assign Task

</button>

</div>

<button onclick="openWorkspace()">
    My Trainees
</button>
<button onclick="openWorkspace()">
View Trainee Submissions
</button>


<button
class="logout"
onclick="logout()">

Logout

</button>

</div>



</div>

</div>

<script type="module" src="trainer.js"></script>

</body>

</html>
